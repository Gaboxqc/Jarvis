# Kai — example configuration.
#
# Copy this to kai.config.yaml and edit that copy. Your real file is gitignored,
# because some values here are credentials even though none of them is a
# password: a Google "secret address in iCal format" lets anyone holding the URL
# read your whole calendar without logging in. Committing one publishes it, and
# git history keeps it even after you delete the line.
#
# Passwords are never stored in any config file. Add the account below, then run
# /connect and type it at the prompt; it goes into the OS credential store.
#
# Changes are picked up on the next turn, no restart needed.

persona:
  name: Kai
  # Free text, injected into the system prompt. Say how you want to be talked to.
  tone_description: >
    Direct and warm. You are a competent assistant, not a cheerful mascot.
    You never pad replies with filler or restate the question back.
  # terse | normal | chatty
  verbosity: terse
  # How the assistant addresses the user. Leave empty for no form of address.
  address_style: ""
  # "en" or "es" (REQ-28)
  language: en
  # Minutes of inactivity before short-term conversation memory resets (REQ-6)
  idle_timeout_minutes: 30

voice:
  # Master switch. Everything works without it — voice is a way in and out,
  # not a separate set of capabilities (REQ-1).
  enabled: false
  input_enabled: true     # speak to it
  output_enabled: true    # it speaks back; muting disables nothing else (REQ-4)

  # Speech recognition, running locally (REQ-3, REQ-26).
  # tiny (~75MB) | base (~145MB) | small (~480MB)
  stt_model: base
  language: en
  # Below this confidence Kai asks you to repeat instead of guessing (REQ-3).
  min_confidence: 0.45

  # Voice for spoken replies. Downloaded voices are listed by `/voice`.
  voice_id: en_US-amy-medium

  # Wake word means an always-open microphone, so it is opt-in on top of voice.
  # With it off, use push-to-talk. Nothing is transcribed before the phrase
  # fires either way (REQ-2, REQ-26).
  wake_enabled: false
  wake_word: hey_jarvis
  wake_threshold: 0.5

  # How long a pause ends your turn, and the hard cap on one utterance.
  silence_ms: 800
  max_utterance_seconds: 30
  # Release the speech models after this long unused (REQ-31).
  unload_after_minutes: 10

brain:
  provider: ollama        # ollama | groq | gemini
  model: llama3
  # 127.0.0.1 rather than "localhost": Windows tries ::1 first, Ollama listens
  # on IPv4 only, and the failed attempt costs about two seconds per call.
  ollama_host: http://127.0.0.1:11434
  temperature: 0.4
  # Seconds before an LLM call is abandoned and reported as a failure (REQ-27)
  timeout_seconds: 120

privacy:
  # Every switch here controls data leaving this machine (REQ-26).
  # Everything not listed runs locally by construction.
  allow_web_search: true
  allow_live_data: true   # currency rates, weather
  allow_cloud_llm: false  # when false, only the local provider is ever used

actions:
  # Skills the user has pre-approved so the gate stops asking (REQ-24).
  # Reviewable and revocable here or in settings. Empty by default.
  pre_approved: []
  # Minutes a pending confirmation stays valid before it expires.
  confirmation_ttl_minutes: 10

skills:
  # Disable any skill by name (REQ-33).
  disabled: []

connectors:
  # Calendars and mail accounts (REQ-8, REQ-13). Both are optional — the
  # assistant is fully useful with none connected.
  #
  # No password is ever written here. Add the account below, then run
  #   /connect calendar <label>     or     /connect mail <label>
  # and type the password at the prompt. It goes straight into the Windows
  # Credential Manager; this file only ever holds the account details (REQ-26).

  calendar: []
  # Read-only, works with any provider that publishes an iCal URL — in Google
  # Calendar it's Settings > your calendar > "Secret address in iCal format":
  #   - label: personal
  #     provider: ics
  #     url: https://calendar.google.com/calendar/ical/.../basic.ics
  #
  # Two-way, for servers that accept an app-specific password (Fastmail,
  # Nextcloud, iCloud). Needed for creating and cancelling events:
  #   - label: work
  #     provider: caldav
  #     url: https://caldav.fastmail.com/dav/
  #     username: you@fastmail.com
  #     writable: true

  mail: []
  # Any IMAP provider. Gmail and Outlook with 2FA require an app password
  # rather than your normal one:
  #   - label: gmail
  #     provider: imap
  #     host: imap.gmail.com
  #     port: 993
  #     username: you@gmail.com
  #     smtp_host: smtp.gmail.com
  #     smtp_port: 587

  # Which briefing sections to include, in order (REQ-11).
  briefing_sections: [calendar, reminders, tasks, mail]

documents:
  # Folders indexed for document search (REQ-16). Text is extracted and indexed
  # locally with SQLite full-text search — nothing is uploaded, and no embedding
  # model is downloaded. Empty means document search is off.
  indexed_folders:
    - ~/Documents
  # Files larger than this are skipped rather than stalling a scan.
  max_file_mb: 25
  # How often the background scan looks for changes.
  rescan_minutes: 15
  # Back off while unplugged, so indexing never eats battery (REQ-31).
  pause_on_battery: true

system:
  # Folders organize_folder and find_files are allowed to touch (REQ-21, REQ-26).
  # Nothing outside these roots can be modified. "~" expands to your home folder.
  allowed_roots:
    - ~/Downloads
    - ~/Documents
    - ~/Desktop
  # Apps closed when a focus session starts (REQ-23)
  distracting_apps:
    - Discord.exe
    - Steam.exe
