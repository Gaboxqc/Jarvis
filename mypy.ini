; Type checking for backend/app.
;
;   .venv\Scripts\python -m mypy --config-file mypy.ini backend/app
;
; Run over the application only. The tests monkeypatch modules, replace classes
; with doubles and hand fixtures around freely, which is what makes them good
; tests and what makes checking them a report on the mocking rather than on the
; code.
;
; It found 26 things on the day it was switched on, and one of them was real: the
; CLI called .word_count on a value that capture.stop() can return as None -- a
; traceback instead of a sentence, in the one code path where the recording is
; already lost. The API had handled it correctly all along, which is the shape of
; bug this catches and review does not. The rest were annotations that had drifted
; from what the code does, and are now fixed rather than silenced.
;
; So there are no per-error suppressions for our own code, and the file should
; stay that way: a checker with exceptions is a checker nobody reads the output of.

[mypy]
python_version = 3.13
mypy_path = backend
explicit_package_bases = True
namespace_packages = True
; Third-party packages here are mostly untyped, and their absence is not a
; finding about this codebase.
ignore_missing_imports = True

; caldav ships py.typed, and under it `caldav.DAVClient` resolves to `object`,
; so constructing a client reads as calling something that is not callable.
; Skipped rather than ignored at the call site: the problem is the package's
; own annotations, and a `type: ignore` in connectors/calendar.py would look
; like a statement about our code.
[mypy-caldav.*]
follow_imports = skip
