[pytest]
testpaths = tests
pythonpath = .
addopts = -q --tb=short
markers =
    slow: exercises the real speech models; skipped when they aren't downloaded
filterwarnings =
    ignore::DeprecationWarning

# Coverage is opt-in, not in addopts.
#
# The suite takes about nine minutes; measuring coverage adds to that, and a
# developer running `pytest` to check one change should not pay for a number
# nobody reads at that moment. CI runs it (see .github/workflows/ci.yml), which
# is where the gate belongs:
#
#     pytest --cov=app --cov-fail-under=65
#
# To see it locally:  pytest --cov=app --cov-report=term-missing
